name: ""
namespace: platform
environment: production
migration:
  mode: initContainer
replicas: 2
image:
  repository: ""
  tag: ""
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
pdb: {minAvailable: 1}
autoscaling: {minReplicas: 2, maxReplicas: 10, targetCPUUtilization: 70}
networkPolicy:
  egress: []
  gatewayNamespace: ""
externalSecret:
  store: ""
  key: ""
  refreshInterval: 1h
gateway:
  enabled: false
  baseDomain: ""
  environmentLabel: ""
  production: false
  hostname: ""
  ingressClassName: apisix
  servicePort: http
  paths: ["/*"]
  methods: [POST]
  security:
    enabled: true
    maxBodySizeMB: 1
    rateLimit: {rate: 100, burst: 50}
    headers:
      X-Content-Type-Options: nosniff
      X-Frame-Options: DENY
      Referrer-Policy: no-referrer
      Strict-Transport-Security: max-age=31536000; includeSubDomains
swaggerDiscovery:
  enabled: false
  path: /swagger/doc.json
  title: ""
