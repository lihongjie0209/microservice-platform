apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                # Fill baseDomain to enable routes for services with exposure=public.
                - environment: development
                  profile: development
                  cluster: https://kubernetes.default.svc
                  namespace: platform-development
                  gatewayNamespace: ingress-apisix-development
                  ingressClass: apisix-dev
                  environmentLabel: dev
                  production: "false"
                  baseDomain: ""
                  imageTag: v0.1.0
                - environment: testing
                  profile: test
                  cluster: https://kubernetes.default.svc
                  namespace: platform-testing
                  gatewayNamespace: ingress-apisix-testing
                  ingressClass: apisix-test
                  environmentLabel: test
                  production: "false"
                  baseDomain: ""
                  imageTag: v0.1.0
                - environment: staging
                  # Staging uses production validation and secret requirements;
                  # only its namespace, credentials and external domain differ.
                  profile: production
                  cluster: https://kubernetes.default.svc
                  namespace: platform-staging
                  gatewayNamespace: ingress-apisix-staging
                  ingressClass: apisix-staging
                  environmentLabel: staging
                  production: "false"
                  baseDomain: ""
                  imageTag: v0.1.0
                - environment: production
                  profile: production
                  cluster: https://kubernetes.default.svc
                  namespace: platform-production
                  gatewayNamespace: ingress-apisix-production
                  ingressClass: apisix-prod
                  environmentLabel: ""
                  production: "true"
                  baseDomain: ""
                  imageTag: v0.1.0
          - list:
              elements:
                - {service: identity-service, schema: identity, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: tenant-service, schema: tenant, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: authorization-service, schema: authorization, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: audit-service, schema: audit, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: config-service, schema: config, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: notification-service, schema: notification, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: file-service, schema: file, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: scheduler-service, schema: scheduler, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: swagger-service, schema: swagger, database: "false", redis: "false", eventBus: "false", exposure: public}
                - {service: application-service, schema: application, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: dictionary-service, schema: dictionary, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: service-registry-service, schema: service_registry, database: "false", redis: "true", eventBus: "false", exposure: public}
                - {service: webhook-service, schema: webhook, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: workflow-service, schema: workflow, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: search-service, schema: search, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: metering-service, schema: metering, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: billing-service, schema: billing, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: rule-service, schema: rule_service, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: data-export-service, schema: data_export, database: "true", redis: "true", eventBus: "true", exposure: public}
                - {service: import-service, schema: data_import, database: "true", redis: "true", eventBus: "true", exposure: public}
  template:
    metadata:
      name: '{{ .service }}-{{ .environment }}'
      labels:
        platform.environment: '{{ .environment }}'
        platform.service: '{{ .service }}'
    spec:
      project: platform
      source:
        repoURL: https://github.com/lihongjie0209/microservice-platform.git
        targetRevision: main
        path: deploy/platform-gitops/charts/platform-service
        helm:
          releaseName: '{{ .service }}'
          parameters:
            - {name: name, value: '{{ .service }}'}
            - {name: namespace, value: '{{ .namespace }}'}
            - {name: environment, value: '{{ .profile }}'}
            - {name: image.repository, value: 'ghcr.io/lihongjie0209/{{ .service }}'}
            - {name: image.tag, value: '{{ .imageTag }}'}
            - {name: database.enabled, value: '{{ .database }}'}
            - {name: database.schema, value: '{{ .schema }}'}
            - {name: database.migrationTable, value: '{{ .schema }}_schema_migrations'}
            - {name: redis.enabled, value: '{{ .redis }}'}
            - {name: eventBus.enabled, value: '{{ .eventBus }}'}
            - name: workflow.enabled
              value: '{{ if eq .service "workflow-service" }}true{{ else }}false{{ end }}'
            - name: search.enabled
              value: '{{ if eq .service "search-service" }}true{{ else }}false{{ end }}'
            - {name: externalSecret.key, value: 'platform/{{ .environment }}/{{ .service }}'}
            - {name: networkPolicy.gatewayNamespace, value: '{{ .gatewayNamespace }}'}
            - {name: gateway.baseDomain, value: '{{ .baseDomain }}'}
            - {name: gateway.environmentLabel, value: '{{ .environmentLabel }}'}
            - {name: gateway.production, value: '{{ .production }}'}
            - {name: gateway.ingressClassName, value: '{{ .ingressClass }}'}
            - name: gateway.enabled
              value: '{{ if and (eq .exposure "public") (ne .baseDomain "") }}true{{ else }}false{{ end }}'
      destination:
        server: '{{ .cluster }}'
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true]
