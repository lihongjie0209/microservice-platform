apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ required "name is required" .Values.name }}
  namespace: {{ required "namespace is required" .Values.namespace }}
data:
  APP_ENV: {{ .Values.environment | quote }}
  APP_HTTP_ADDRESS: 0.0.0.0:8080
  APP_GRPC_ADDRESS: 0.0.0.0:9090
  APP_DATABASE_ENABLED: {{ .Values.database.enabled | quote }}
  APP_DATABASE_TYPE: {{ .Values.database.type | quote }}
  APP_DATABASE_NAME: {{ .Values.database.name | quote }}
  APP_DATABASE_SCHEMA: {{ .Values.database.schema | quote }}
  APP_REDIS_ENABLED: {{ .Values.redis.enabled | quote }}
  APP_EVENT_BUS_ENABLED: {{ .Values.eventBus.enabled | quote }}
  APP_EVENT_BUS_URLS: {{ .Values.eventBus.urls | quote }}
  APP_EVENT_BUS_STREAM_NAME: {{ .Values.eventBus.streamName | quote }}
  APP_AUTH_JWKS_URL: {{ printf "http://identity-service.%s.svc.cluster.local:8080/.well-known/jwks.json" .Values.namespace | quote }}
  APP_AUTH_ISSUER: {{ .Values.auth.issuer | quote }}
  APP_AUTH_AUDIENCE: {{ .Values.name | quote }}
  {{- if .Values.gateway.enabled }}
  APP_HTTP_CORS_ENABLED: "true"
  APP_HTTP_CORS_ALLOWED_ORIGINS: {{ printf "[%s]" (include "platform-service.consoleOrigin" .) | quote }}
  {{- end }}
  APP_OBSERVABILITY_METRICS_ENABLED: "true"
  APP_MIGRATION_AUTO_UP: "false"
  APP_MIGRATION_CREATE_SCHEMA: "false"
  APP_MIGRATION_PATH: /app/migrations/postgres
  APP_MIGRATION_TABLE: {{ .Values.database.migrationTable | quote }}
  {{- if .Values.workflow.enabled }}
  APP_TEMPORAL_ENABLED: "true"
  APP_TEMPORAL_HOST_PORT: {{ .Values.workflow.temporalHostPort | quote }}
  APP_TEMPORAL_NAMESPACE: {{ .Values.workflow.temporalNamespace | quote }}
  APP_TEMPORAL_TASK_QUEUE: {{ .Values.workflow.temporalTaskQueue | quote }}
  APP_OUTBOUND_GRPC_AUTHORIZATION_TARGET: {{ printf "dns:///authorization-service.%s.svc.cluster.local:9090" .Values.namespace | quote }}
  {{- end }}
  {{- if .Values.search.enabled }}
  APP_OPENSEARCH_ENABLED: "true"
  APP_OPENSEARCH_ADDRESSES: {{ .Values.search.openSearchAddresses | quote }}
  APP_OUTBOUND_GRPC_AUTHORIZATION_TARGET: {{ printf "dns:///authorization-service.%s.svc.cluster.local:9090" .Values.namespace | quote }}
  {{- end }}
