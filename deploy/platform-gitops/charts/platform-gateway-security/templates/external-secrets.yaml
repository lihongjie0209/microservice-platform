{{- if and .Values.enabled .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.issuer.eabSecretName }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ .Values.issuer.eabSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.eabRemoteKey is required" .Values.externalSecrets.eabRemoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.dnsSecretName }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ .Values.externalSecrets.dnsSecretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "externalSecrets.dnsRemoteKey is required" .Values.externalSecrets.dnsRemoteKey }}
{{- end }}
