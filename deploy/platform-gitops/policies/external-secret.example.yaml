apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: SERVICE_NAME
spec:
  refreshInterval: 1h
  secretStoreRef: {name: platform-vault, kind: ClusterSecretStore}
  target: {name: SERVICE_NAME, creationPolicy: Owner}
  dataFrom:
    - extract: {key: platform/ENVIRONMENT/SERVICE_NAME}
