name: microservice-platform-local

x-platform-env: &platform-env
  APP_ENV: compose
  APP_HTTP_ADDRESS: 0.0.0.0:8080
  APP_GRPC_ADDRESS: 0.0.0.0:9090
  APP_DATABASE_ENABLED: "true"
  APP_DATABASE_TYPE: postgres
  APP_DATABASE_NAME: platform
  APP_REDIS_ENABLED: "true"
  APP_REDIS_ADDRESS: redis:6379
  APP_MIGRATION_AUTO_UP: "true"
  APP_MIGRATION_CREATE_SCHEMA: "false"
  APP_MIGRATION_PATH: /app/migrations/postgres
  APP_EVENT_BUS_ENABLED: "true"
  APP_EVENT_BUS_URLS: nats://nats:4222
  # All platform.* events belong to one JetStream stream. Consumers use
  # independent durable names; services must not create overlapping streams.
  APP_EVENT_BUS_STREAM_NAME: PLATFORM_EVENTS
  APP_AUTH_ISSUER: identity-service

x-platform-dependencies: &platform-dependencies
  postgres-bootstrap: {condition: service_completed_successfully}
  redis: {condition: service_healthy}
  nats: {condition: service_healthy}

x-platform-service: &platform-service
  profiles: [platform]
  restart: unless-stopped
  depends_on: *platform-dependencies

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: platform-admin-dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U platform_admin -d platform]
      interval: 3s
      timeout: 3s
      retries: 30

  postgres-bootstrap:
    image: postgres:17-alpine
    profiles: [platform]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      PGPASSWORD: platform-admin-dev
    volumes:
      - ./postgres/init/001-platform.sql:/bootstrap/001-platform.sql:ro
    command:
      - psql
      - -h
      - postgres
      - -U
      - platform_admin
      - -d
      - platform
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /bootstrap/001-platform.sql

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: platform
      MYSQL_USER: platform
      MYSQL_PASSWORD: platform-dev
      MYSQL_ROOT_PASSWORD: root-dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uplatform, -pplatform-dev]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.14.6-alpine
    command: [--jetstream, --store_dir=/data, --http_port=8222]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8222/healthz]
      interval: 3s
      timeout: 3s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [opensearch-data:/usr/share/opensearch/data]
    healthcheck:
      test: [CMD-SHELL, curl -fsS http://127.0.0.1:9200/_cluster/health]
      interval: 5s
      timeout: 5s
      retries: 40

  temporal:
    image: temporalio/auto-setup:1.29.7
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: platform_admin
      POSTGRES_PWD: platform-admin-dev
      POSTGRES_SEEDS: postgres
    ports: ["7233:7233"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, tctl, --address, temporal:7233, cluster, health]
      interval: 5s
      timeout: 5s
      retries: 40

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: platform-minio
      MINIO_ROOT_PASSWORD: platform-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    profiles: [platform]
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: [/bin/sh, -c]
    command:
      - mc alias set local http://minio:9000 platform-minio platform-minio-dev && mc mb --ignore-existing local/platform-files

  identity-service:
    <<: *platform-service
    build: {context: ../../services/identity-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18081:8080", "19081:9090"]
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: identity
      APP_DATABASE_DSN: postgres://identity_service:identity-dev@postgres:5432/platform?sslmode=disable&search_path=identity
      APP_MIGRATION_DATABASE_URL: postgres://identity_service:identity-dev@postgres:5432/platform?sslmode=disable&search_path=identity
      APP_MIGRATION_TABLE: identity_schema_migrations
      APP_JWT_SECRET: local-identity-signing-secret-000000000000

  tenant-service:
    <<: *platform-service
    build: {context: ../../services/tenant-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18082:8080", "19082:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      service-registry-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: tenant
      APP_DATABASE_DSN: postgres://tenant_service:tenant-dev@postgres:5432/platform?sslmode=disable&search_path=tenant
      APP_MIGRATION_DATABASE_URL: postgres://tenant_service:tenant-dev@postgres:5432/platform?sslmode=disable&search_path=tenant
      APP_MIGRATION_TABLE: tenant_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: tenant-service

  authorization-service:
    <<: *platform-service
    build: {context: ../../services/authorization-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18083:8080", "19083:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: authorization
      APP_DATABASE_DSN: postgres://authorization_service:authorization-dev@postgres:5432/platform?sslmode=disable&search_path=authorization
      APP_MIGRATION_DATABASE_URL: postgres://authorization_service:authorization-dev@postgres:5432/platform?sslmode=disable&search_path=authorization
      APP_MIGRATION_TABLE: authorization_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: authorization-service

  audit-service:
    <<: *platform-service
    build: {context: ../../services/audit-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18084:8080", "19084:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: audit
      APP_DATABASE_DSN: postgres://audit_service:audit-dev@postgres:5432/platform?sslmode=disable&search_path=audit
      APP_MIGRATION_DATABASE_URL: postgres://audit_service:audit-dev@postgres:5432/platform?sslmode=disable&search_path=audit
      APP_MIGRATION_TABLE: audit_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: audit-service

  config-service:
    <<: *platform-service
    build: {context: ../../services/config-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18085:8080", "19085:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: config
      APP_DATABASE_DSN: postgres://config_service:config-dev@postgres:5432/platform?sslmode=disable&search_path=config
      APP_MIGRATION_DATABASE_URL: postgres://config_service:config-dev@postgres:5432/platform?sslmode=disable&search_path=config
      APP_MIGRATION_TABLE: config_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: config-service

  notification-service:
    <<: *platform-service
    build: {context: ../../services/notification-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18086:8080", "19086:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: notification
      APP_DATABASE_DSN: postgres://notification_service:notification-dev@postgres:5432/platform?sslmode=disable&search_path=notification
      APP_MIGRATION_DATABASE_URL: postgres://notification_service:notification-dev@postgres:5432/platform?sslmode=disable&search_path=notification
      APP_MIGRATION_TABLE: notification_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: notification-service

  file-service:
    <<: *platform-service
    build: {context: ../../services/file-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18087:8080", "19087:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: file
      APP_DATABASE_DSN: postgres://file_service:file-dev@postgres:5432/platform?sslmode=disable&search_path=file
      APP_MIGRATION_DATABASE_URL: postgres://file_service:file-dev@postgres:5432/platform?sslmode=disable&search_path=file
      APP_MIGRATION_TABLE: file_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: file-service
      APP_OBJECT_STORAGE_ENABLED: "true"
      APP_OBJECT_STORAGE_ENDPOINT: minio:9000
      APP_OBJECT_STORAGE_ACCESS_KEY: platform-minio
      APP_OBJECT_STORAGE_SECRET_KEY: platform-minio-dev
      APP_OBJECT_STORAGE_BUCKET: platform-files

  scheduler-service:
    <<: *platform-service
    build: {context: ../../services/scheduler-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18088:8080", "19088:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      audit-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: scheduler
      APP_DATABASE_DSN: postgres://scheduler_service:scheduler-dev@postgres:5432/platform?sslmode=disable&search_path=scheduler
      APP_MIGRATION_DATABASE_URL: postgres://scheduler_service:scheduler-dev@postgres:5432/platform?sslmode=disable&search_path=scheduler
      APP_MIGRATION_TABLE: scheduler_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: scheduler-service

  application-service:
    <<: *platform-service
    build: {context: ../../services/application-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18090:8080", "19090:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: application
      APP_DATABASE_DSN: postgres://application_service:application-dev@postgres:5432/platform?sslmode=disable&search_path=application
      APP_MIGRATION_DATABASE_URL: postgres://application_service:application-dev@postgres:5432/platform?sslmode=disable&search_path=application
      APP_MIGRATION_TABLE: application_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: application-service

  dictionary-service:
    <<: *platform-service
    build: {context: ../../services/dictionary-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18091:8080", "19091:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      service-registry-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: dictionary
      APP_DATABASE_DSN: postgres://dictionary_service:dictionary-dev@postgres:5432/platform?sslmode=disable&search_path=dictionary
      APP_MIGRATION_DATABASE_URL: postgres://dictionary_service:dictionary-dev@postgres:5432/platform?sslmode=disable&search_path=dictionary
      APP_MIGRATION_TABLE: dictionary_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: dictionary-service

  service-registry-service:
    <<: *platform-service
    build: {context: ../../services/service-registry-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18092:8080", "19092:9090"]
    environment:
      <<: *platform-env
      APP_DATABASE_ENABLED: "false"
      APP_MIGRATION_AUTO_UP: "false"
      APP_EVENT_BUS_ENABLED: "false"
      APP_CRON_ENABLED: "false"
      APP_AUTH_PSK_ENABLED: "true"
      APP_AUTH_PSK_KEY: registry-dev-psk-00000000000000000000

  webhook-service:
    <<: *platform-service
    build: {context: ../../services/webhook-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18093:8080", "19093:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: webhook
      APP_DATABASE_DSN: postgres://webhook_service:webhook-dev@postgres:5432/platform?sslmode=disable&search_path=webhook
      APP_MIGRATION_DATABASE_URL: postgres://webhook_service:webhook-dev@postgres:5432/platform?sslmode=disable&search_path=webhook
      APP_MIGRATION_TABLE: webhook_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: webhook-service
      APP_WEBHOOK_ENCRYPTION_KEY: d2ViaG9vay1kZXYta2V5LTMyLWJ5dGVzLWxvbmchISE=

  workflow-service:
    <<: *platform-service
    build: {context: ../../services/workflow-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18094:8080", "19094:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      authorization-service: {condition: service_healthy}
      temporal: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: workflow
      APP_DATABASE_DSN: postgres://workflow_service:workflow-dev@postgres:5432/platform?sslmode=disable&search_path=workflow
      APP_MIGRATION_DATABASE_URL: postgres://workflow_service:workflow-dev@postgres:5432/platform?sslmode=disable&search_path=workflow
      APP_MIGRATION_TABLE: workflow_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: workflow-service
      APP_TEMPORAL_ENABLED: "true"
      APP_TEMPORAL_HOST_PORT: temporal:7233

  search-service:
    <<: *platform-service
    build: {context: ../../services/search-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18095:8080", "19095:9090"]
    depends_on:
      <<: *platform-dependencies
      identity-service: {condition: service_healthy}
      authorization-service: {condition: service_healthy}
      opensearch: {condition: service_healthy}
    environment:
      <<: *platform-env
      APP_DATABASE_SCHEMA: search
      APP_DATABASE_DSN: postgres://search_service:search-dev@postgres:5432/platform?sslmode=disable&search_path=search
      APP_MIGRATION_DATABASE_URL: postgres://search_service:search-dev@postgres:5432/platform?sslmode=disable&search_path=search
      APP_MIGRATION_TABLE: search_schema_migrations
      APP_AUTH_JWKS_URL: http://identity-service:8080/.well-known/jwks.json
      APP_AUTH_AUDIENCE: search-service
      APP_OPENSEARCH_ENABLED: "true"
      APP_OPENSEARCH_ADDRESSES: http://opensearch:9200
      APP_OUTBOUND_GRPC_AUTHORIZATION_TARGET: authorization-service:9090

  swagger-service:
    profiles: [platform]
    restart: unless-stopped
    build: {context: ../../services/swagger-service, args: {GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"}}
    ports: ["18089:8080", "19089:9090"]
    depends_on:
      identity-service: {condition: service_healthy}
      tenant-service: {condition: service_healthy}
      authorization-service: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      config-service: {condition: service_healthy}
      notification-service: {condition: service_healthy}
      file-service: {condition: service_healthy}
      scheduler-service: {condition: service_healthy}
      application-service: {condition: service_healthy}
      dictionary-service: {condition: service_healthy}
      service-registry-service: {condition: service_healthy}
      webhook-service: {condition: service_healthy}
      workflow-service: {condition: service_healthy}
      search-service: {condition: service_healthy}
    environment:
      APP_ENV: compose
      APP_HTTP_ADDRESS: 0.0.0.0:8080
      APP_GRPC_ENABLED: "false"


volumes:
  postgres-data:
  mysql-data:
  redis-data:
  nats-data:
  opensearch-data:
  minio-data:
